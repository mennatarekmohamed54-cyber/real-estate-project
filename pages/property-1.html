<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فيلا البستان | أورا العقارية</title>

    <!-- ===== المكتبات المحلية ===== -->
    <link rel="stylesheet" href="../libs/bootstrap.min.css" />
    <link rel="stylesheet" href="../libs/font-awesome/all.min.css" />
    <link rel="stylesheet" href="../libs/swiper-bundle/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../libs/aos/aos.css" />
    
    <!-- ===== Google Fonts ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet" />
    
    <!-- ===== ملفات المشروع ===== -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />

    <style>
        /* تنسيقات إضافية خاصة بالصفحة */
        .property-detail {
            padding: 120px 0 70px;
        }
        .property-detail .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }
        .property-detail .grid .main-image {
            width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .property-detail .grid .main-image:hover {
            box-shadow: var(--shadow-hover);
            transform: scale(1.01);
        }
        .property-detail .grid .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
        }
        .property-detail .grid .price {
            font-size: 2rem;
            color: var(--secondary);
            font-weight: 700;
            margin: 12px 0;
        }
        .property-detail .grid .meta {
            display: flex;
            gap: 24px;
            color: var(--text-muted);
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .property-detail .grid .meta i {
            color: var(--secondary);
            margin-left: 5px;
        }
        .property-detail .grid .description {
            color: var(--text-muted);
            line-height: 2;
            margin: 16px 0;
            font-size: 1.05rem;
        }
        .property-detail .grid .specs {
            color: var(--text-muted);
            line-height: 2;
            margin: 16px 0;
            font-size: 1.05rem;
        }
        .property-detail .grid .specs strong {
            color: var(--text);
        }
        .property-detail .grid .buttons {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .property-detail .grid .buttons .btn-contact {
            display: inline-block;
            background: var(--secondary);
            color: #fff;
            padding: 12px 36px;
            font-weight: 700;
            transition: var(--transition);
            text-decoration: none;
        }
        .property-detail .grid .buttons .btn-contact:hover {
            background: var(--primary);
            transform: translateY(-3px);
        }
        .property-detail .grid .buttons .btn-back {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            padding: 12px 36px;
            font-weight: 700;
            transition: var(--transition);
            text-decoration: none;
        }
        .property-detail .grid .buttons .btn-back:hover {
            background: var(--secondary);
            transform: translateY(-3px);
        }

        /* ===== ريسبونسيف ===== */
        @media (max-width: 992px) {
            .property-detail .grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .property-detail .grid .title {
                font-size: 2.2rem;
            }
        }
        @media (max-width: 768px) {
            .property-detail {
                padding: 100px 0 50px;
            }
            .property-detail .grid .title {
                font-size: 1.8rem;
            }
            .property-detail .grid .price {
                font-size: 1.6rem;
            }
            .property-detail .grid .meta {
                gap: 14px;
                font-size: 0.9rem;
            }
        }
        @media (max-width: 480px) {
            .property-detail .grid .title {
                font-size: 1.5rem;
            }
            .property-detail .grid .price {
                font-size: 1.3rem;
            }
            .property-detail .grid .buttons {
                flex-direction: column;
            }
            .property-detail .grid .buttons a {
                text-align: center;
                width: 100%;
            }
            .property-detail .grid .meta {
                gap: 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
